services:
  db:
    image: mariadb:11
    container_name: cms-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-cms}
      MYSQL_USER: ${DB_USER:-cms}
      MYSQL_PASSWORD: ${DB_PASS:-cmspassword}
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"   # internal only, not exposed to host
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-cms}
      DB_PASS: ${DB_PASS:-cmspassword}
      DB_NAME: ${DB_NAME:-cms}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3000
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    expose:
      - "3000"   # Coolify will route traffic to this port
    volumes:
      - uploads_data:/app/static/uploads   # persistent storage for uploaded media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      start_period: 10s
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  db_data:
  uploads_data:
