<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribed - {{ .siteTitle }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">{{ .siteTitle }}</a>
        <nav>
          <ul class="nav">
            <li><a href="/">Home</a></li>
            <li><a href="/posts">Posts</a></li>
            <li><a href="/subscribe">Subscribe</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="container main">
    <div style="max-width: 500px; margin: 2rem auto; text-align: center;">
      <div style="font-size: 3rem; margin-bottom: 1rem;">✓</div>
      <h1>Thank You!</h1>
      <p>You've successfully subscribed to {{ .siteTitle }}.</p>
      <p style="color: var(--color-text-muted);">A confirmation email has been sent to <strong>{{ .email }}</strong>.</p>

      <div style="margin-top: 2rem;">
        <a href="/" class="button">Back to Home</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{ now | date "2006" }} {{ .siteTitle }}. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
