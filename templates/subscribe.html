<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribe - {{ .siteTitle }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">{{ .siteTitle }}</a>
        <nav>
          <ul class="nav">
            <li><a href="/">Home</a></li>
            <li><a href="/posts">Posts</a></li>
            <li><a href="/subscribe">Subscribe</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="container main">
    <div style="max-width: 500px; margin: 2rem auto;">
      <h1>Subscribe to {{ .siteTitle }}</h1>
      <p>Get notified when we publish new posts.</p>

      <form method="POST" action="/subscribe" style="margin-top: 2rem;">
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" style="width: 100%;">Subscribe</button>
      </form>

      <p style="margin-top: 2rem; color: var(--color-text-muted); font-size: 0.9rem; text-align: center;">
        We respect your privacy. Unsubscribe at any time.
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{ now | date "2006" }} {{ .siteTitle }}. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
